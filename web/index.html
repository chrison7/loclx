<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Information Demo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container">
  <div class="card">
    <div class="icon-wrapper">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>
    <h1>Browser Information Demo</h1>
    <p class="desc">
      See what information modern websites can access or request from your browser.
    </p>
    <p class="disclosure">
      This demonstration may request access to your device location. Location information is shared only if you approve the browser's permission request.
    </p>
    <p class="note">
      You can deny the request at any time.
    </p>
    <div class="actions">
      <button type="button" id="btn-start-demo" class="btn-primary">Start Demo</button>
    </div>
    <div id="status-message" class="status-msg" aria-live="polite"></div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
